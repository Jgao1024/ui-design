name: ComponentGalleryMac
options:
  bundleIdPrefix: dev.jgao
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "27.0"
targets:
  ComponentGalleryMac:
    type: application
    platform: macOS
    sources:
      - path: ComponentGalleryMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jgao.ComponentGalleryMac
        PRODUCT_NAME: ComponentGalleryMac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: macOS 27 组件展示
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
